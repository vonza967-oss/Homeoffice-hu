 <div class="detail"><div class="detail-media"><img src="${p.image}" alt="${e(p.name)} – koncepcióillusztráció"></div><div class="detail-info"><span class="eyebrow">${e(categoryName(p.category))}</span><h1>${e(p.name)}</h1><p>${e(p.description)}</p><div class="detail-price">${money(p.price)}</div><div class="notice-inline">${priceNote}</div><div class="detail-actions">${quantity('detail',detailQty)}<button class="btn btn-primary" data-action="add-cart" data-id="${p.id}">Kosárba teszem ${svg('arrow')}</button>${favoriteButton(p,true)}</div><p class="notice-inline" style="margin-top:13px">A kosár demóként működik; valódi vásárlás és fizetés nem lehetséges.</p>
 <div class="detail-description"><h3>A termékről</h3><p>${e(p.description)}</p><div class="specs"><strong>Kategória</strong><span>${e(categoryName(p.category))}</span></div><div class="specs"><strong>Típus</strong><span>${p.source.type==='concept'?'Koncepciótermék – nincs ellenőrzött beszállító':'Alibaba termékválogatás – beszállítói egyeztetés szükséges'}</span></div><div class="specs"><strong>Ár</strong><span>Nem végleges, kizárólag bemutató jellegű</span></div>${p.source.url?`<a class="text-link" target="_blank" rel="noopener noreferrer" href="${p.source.url}">Eredeti Alibaba-ajánlat megtekintése</a>`:''}<div style="margin-top:22px" class="info-message">A képen látható termék illusztráció. Műszaki adatok, elérhetőség, szállítási és garanciális feltételek még nem véglegesek.</div></div></div></div>
 ${related.length?`<section class="related">${sectionTitle('Még több inspiráció','Ebből a kategóriából',hrefCat(cat(p.category)),'Összes megtekintése')}${cards(related)}</section>`:''}</main>`}
function cartRow(p){return `<div class="cart-row"><a href="${hrefProduct(p)}"><img src="${p.image}" alt="${e(p.name)} illusztráció"></a><div><a href="${hrefProduct(p)}"><strong>${e(p.name)}</strong></a><p>${money(p.price)} · bemutatóár</p><div class="cart-row-actions">${quantity(p.id,p.qty)}<button class="remove-btn" data-action="remove-item" data-id="${p.id}">Eltávolítás</button></div></div></div>`}
function cartPage(){const list=cartItems();return `<main class="container cart-page"><div class="page-intro"><span class="eyebrow">Kosár / Bemutató</span><h1>A kosarad</h1></div>${list.length?`${list.map(cartRow).join('')}<div class="cart-page-summary"><div class="cart-total"><span>Bemutató részösszeg</span><span>${money(cartSum())}</span></div><div class="info-message">Ez a kosár csak bemutató. A termékek nem rendelhetők, a fizetés nem aktív.</div><a class="btn btn-primary btn-wide" style="margin-top:17px" href="#/penztar">Demó pénztár ${svg('arrow')}</a><a class="btn btn-outline btn-wide" style="margin-top:10px" href="#/termekek">Vissza a termékekhez</a></div>`:`<div class="empty-state"><div class="empty-icon">○</div><h2>A kosarad üres.</h2><p>Fedezz fel néhány inspiráló terméket.</p><a class="btn btn-primary" href="#/termekek">Termékek böngészése</a></div>`}</main>`}
function favPage(){const ps=products.filter(p=>state.favs.includes(p.id));return `<main class="container"><div class="page-intro"><span class="eyebrow">Gyűjteményed</span><h1>Kedvencek</h1><p>A kiválasztott termékek ebben a böngészőben maradnak elmentve.</p></div>${ps.length?cards(ps):`<div class="empty-state"><h2>Még nincs kedvenced.</h2><p>A termékkártyákon található szívecskével elmentheted, ami tetszik.</p><a class="btn btn-primary" href="#/termekek">Összes termék</a></div>`}</main>`}
function checkoutPage(){const list=cartItems();return `<main class="container"><div class="page-intro"><span class="eyebrow">Csak előnézet</span><h1>Demó pénztár</h1><p>A rendelés és a fizetés még nincs bekapcsolva. A webshop nem gyűjt szállítási vagy bankkártyaadatokat.</p></div><div class="checkout-demo"><div><div class="info-message"><strong>Bemutató rendelési folyamat.</strong><br>Az itt látható termékek és árak csak a weboldal dizájnját demonstrálják. Beszállítói megállapodás, tényleges készlet és fizetési rendszer még nem áll rendelkezésre.</div><a class="btn btn-outline" style="margin-top:26px" href="#/termekek">Vissza a termékekhez</a></div><aside><h3>Összesítő</h3><ul>${list.map(p=>`<li><span>${e(p.name)} × ${p.qty}</span><strong>${money(p.price*p.qty)}</strong></li>`).join('')}</ul><hr style="border:0;border-top:1px solid #ddd8ce;margin:19px 0"><div class="cart-total"><span>Bemutató összeg</span><span>${money(cartSum())}</span></div><button class="btn btn-primary btn-wide" disabled>Megrendelés nem elérhető</button></aside></div></main>`}
function simplePage(id){const shared=`<div class="info-message">A Homeoffice.hu jelenleg bemutató webáruház. A szolgáltató adatai, a végleges szerződéses feltételek és a vásárlási funkciók még nincsenek beállítva.</div>`;
 const content={
 rolunk:['Rólunk',`<p>A Homeoffice.hu egy egyszerű ötletből indul: a munkakörnyezet legyen ugyanolyan átgondolt, mint az a munka, amit benne végzünk.</p><img class="about-hero" src="assets/hero.svg" alt="Letisztult otthoni munkasarok"><h2>Kevesebb, de jobb.</h2><p>Egymáshoz illő árnyalatok, praktikus forma, minőségi hatás. A cél nem a legtöbb termék, hanem a harmonikus otthoni munkaállomás kialakítása.</p><h2>Hol tartunk?</h2><p>Jelenleg koncepciówebshopot építünk. A termékek egy része kiválasztott Alibaba-ajánlat, más része inspirációs designkoncepció.</p>`],
 kapcsolat:['Kapcsolat',`${shared}<p>A kapcsolatfelvételi űrlap bemutató változat, nem továbbít adatot.</p><form id="contact-form" class="contact-form"><input class="field" name="name" required placeholder="Név" aria-label="Név"><input class="field" type="email" name="email" required placeholder="E-mail-cím" aria-label="E-mail-cím"><textarea class="field" name="message" required placeholder="Üzenet" aria-label="Üzenet"></textarea><button class="btn btn-primary">Demó küldés</button></form>`],
 szallitas:['Szállítás és visszaküldés',`${shared}<h2>Szállítás</h2><p>A magyarországi kiszállítás költsége és ideje jelenleg nincs meghatározva. A beszállítókkal történő egyeztetés után pontosítjuk.</p><h2>Elállás</h2><p>Az EU-ban a fogyasztókat távollévők között kötött szerződéseknél főszabály szerint 14 napos elállási jog illeti meg. A pontos jogi feltételeket indulás előtt véglegesíteni kell.</p>`],
 adatvedelem:['Adatkezelési tájékoztató',`${shared}<h2>Demó adatkezelés</h2><p>A kedvenceket és a kosár tartalmát kizárólag a böngésző helyi tárhelyén tárolja az oldal. Az űrlapok nem küldenek adatokat szerverre.</p><h2>Jogi ellenőrzés szükséges</h2><p>A végleges GDPR-tájékoztatót a webshop élesítése előtt kell elkészíteni, az adatkezelő és az adatfeldolgozók valódi adataival.</p>`],
 aszf:['Általános Szerződési Feltételek',`${shared}<h2>Tervezet, nem végleges dokumentum</h2><p>Az ÁSZF elkészítéséhez a vállalkozás adatait, a szállítási és fizetési feltételeket, az elállás és a szavatosság szabályait véglegesíteni kell. A bemutató oldalon szerződés nem jön létre.</p>`]
 };
 const [title,body]=content[id]||['Az oldal nem található','<p>Ez a link nem létezik.</p>'];return `<main class="container page-text"><span class="eyebrow">Homeoffice.hu / Információ</span><h1>${e(title)}</h1>${body}</main>`}
function drawerHTML(){const list=cartItems();return state.drawer?`<div class="drawer-overlay" data-action="drawer-overlay"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Kosár"><div class="drawer-header"><h2>Kosár (${cartCount()})</h2><button class="icon-btn" data-action="drawer-close" aria-label="Kosár bezárása">${svg('close')}</button></div><div class="drawer-body">${list.length?list.map(cartRow).join(''):`<div class="empty-state"><h2>A kosarad üres.</h2><p>Válogass az inspirációs termékekből.</p></div>`}</div><div class="drawer-footer"><div class="cart-total"><span>Bemutató részösszeg</span><span>${money(cartSum())}</span></div><p class="small muted">Nem valódi ajánlat. Rendelés nem lehetséges.</p><a class="btn btn-primary btn-wide" data-action="drawer-close" href="#/kosar">Kosár megtekintése</a><a class="btn btn-outline btn-wide" style="margin-top:9px" data-action="drawer-close" href="#/penztar">Demó pénztár</a></div></aside></div>`:''}
function mobileHTML(){return state.mobile?`<div class="mobile-overlay" data-action="mobile-overlay"><div class="mobile-panel"><div class="mobile-top"><a class="logo" href="#/">Homeoffice<span>.hu</span></a><button class="icon-btn" data-action="mobile-close" aria-label="Menü bezárása">${svg('close')}</button></div><a href="#/termekek">Összes termék</a><span class="mobile-label">Kategóriák</span>${categories.map(c=>`<a href="${hrefCat(c)}">${e(c.name)}</a>`).join('')}<span class="mobile-label">Kollekciók</span>${collections.map(c=>`<a href="${hrefCol(c)}">${e(c.name)}</a>`).join('')}<a href="#/kedvencek">Kedvencek</a><a href="#/rolunk">Rólunk</a><a href="#/kapcsolat">Kapcsolat</a></div></div>`:''}
function render({scroll=false}={}){const {parts,params}=getRoute();let page=parts[0]||'home';let id=parts[1]||'';let content='';let title='Homeoffice.hu – A munkatered új szintje';
 if(page==='home')content=home();
 else if(page==='termekek'){content=listPage(null,params.get('q')||'',params.get('sort')||'featured');title='Összes termék – Homeoffice.hu'}
 else if(page==='kategoria'&&cat(id)){content=listPage(id,'',params.get('sort')||'featured');title=`${categoryName(id)} – Homeoffice.hu`}
 else if(page==='kollekcio'&&col(id)){content=collectionPage(col(id));title=`${col(id).name} – Homeoffice.hu`}
 else if(page==='termek'&&byId(id)){content=productPage(byId(id));title=`${byId(id).name} – Homeoffice.hu`}
 else if(page==='kosar'){content=cartPage();title='Kosár – Homeoffice.hu'}
 else if(page==='kedvencek'){content=favPage();title='Kedvencek – Homeoffice.hu'}
 else if(page==='penztar'){content=checkoutPage();title='Demó pénztár – Homeoffice.hu'}
 else if(['rolunk','kapcsolat','szallitas','adatvedelem','aszf'].includes(page)){content=simplePage(page);title=`${page} – Homeoffice.hu`}
 else {content=simplePage('404');title='Nem található – Homeoffice.hu'}
 document.title=title;
 $('#app').innerHTML=header()+content+footer();$('#drawer-root').innerHTML=mobileHTML()+drawerHTML();
 document.body.style.overflow=(state.drawer||state.mobile)?'hidden':'';
 if(scroll)window.scrollTo({top:0,behavior:'instant'});
}
let detailQty=1;
function navigateTo(query){state.searchOpen=false;state.mobile=false;state.drawer=false;const target='#/'+query;if(location.hash===target)render({scroll:true});else location.hash=target}
function bind(){window.addEventListener('hashchange',()=>{state.drawer=false;state.mobile=false;state.navOpen=null;state.searchOpen=false;detailQty=1;render({scroll:true})});
 document.addEventListener('click',ev=>{
  const actionEl=ev.target.closest('[data-action]');if(!actionEl)return;
  const act=actionEl.dataset.action,id=actionEl.dataset.id;
  if(act==='drawer-overlay'&&ev.target!==actionEl)return;
  if(act==='mobile-overlay'&&ev.target!==actionEl)return;
  if(['drawer-open','drawer-close','mobile-open','mobile-close','mobile-overlay','drawer-overlay','search-toggle','nav-toggle','favorite','add-cart','qty-plus','qty-minus','remove-item'].includes(act) && !(actionEl.matches('a[href]')&&act==='drawer-close'))ev.preventDefault();
  if(act==='drawer-open')state.drawer=true;
  if(['drawer-close','drawer-overlay'].includes(act))state.drawer=false;
  if(act==='mobile-open')state.mobile=true;
  if(['mobile-close','mobile-overlay'].includes(act))state.mobile=false;
  if(act==='search-toggle')state.searchOpen=!state.searchOpen;
  if(act==='nav-toggle')state.navOpen=state.navOpen===actionEl.dataset.target?null:actionEl.dataset.target;
  if(act==='favorite'){
   state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[...state.favs,id];persist();notify(state.favs.includes(id)?'Hozzáadva a kedvencekhez':'Eltávolítva a kedvencekből');
  }
  if(act==='add-cart'){state.cart[id]=(state.cart[id]||0)+detailQty;state.cart[id]=Math.min(99,state.cart[id]);persist();state.drawer=true;notify('Hozzáadva a bemutatókosárhoz')}
  if(['qty-plus','qty-minus'].includes(act)){
    const delta=act==='qty-plus'?1:-1;
    if(id==='detail')detailQty=Math.max(1,Math.min(99,detailQty+delta));
    else{state.cart[id]=(state.cart[id]||0)+delta;if(state.cart[id]<=0)delete state.cart[id];if(state.cart[id]>99)state.cart[id]=99;persist()}
  }
  if(act==='remove-item'){delete state.cart[id];persist()}
  if(!['drawer-open','mobile-open'].includes(act)){
   const y=window.scrollY;render();window.scrollTo(0,y);
   if(act==='search-toggle'&&state.searchOpen)$('#search-input')?.focus();
  }else render();
 });
 document.addEventListener('submit',ev=>{
  const form=ev.target;if(!['search-form','newsletter-form','contact-form'].includes(form.id))return;ev.preventDefault();
  if(form.id==='search-form'){const q=new FormData(form).get('q')?.trim();if(q)navigateTo(`termekek?q=${encodeURIComponent(q)}`)}
  if(form.id==='newsletter-form')notify('Ez egy demó űrlap: nem mentettünk el adatokat.');
  if(form.id==='contact-form')notify('Ez egy demó űrlap: üzenetet nem küldtünk.');
 });
 document.addEventListener('change',ev=>{
  if(ev.target.id!=='sort-select')return;
  let {parts,params}=getRoute();params.set('sort',ev.target.value);
  let url=parts.join('/');navigateTo(url+'?'+params.toString());
 });
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(state.drawer||state.mobile||state.searchOpen||state.navOpen){state.drawer=false;state.mobile=false;state.searchOpen=false;state.navOpen=null;render()}}});
}
bind();render();

</script></body></html>
