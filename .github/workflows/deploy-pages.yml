name: Build, inspect and publish Homeoffice Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .image-cache
          key: product-images-${{ hashFiles('catalog.json', 'catalog-expansion.json', 'image-sources.json', 'scripts/build.cjs') }}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build and validate original product photographs
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile interaction and image checks
        run: npm run qa
      - name: Save inspectable browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeoffice-visual-qa
          path: qa
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish verified concept
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public URL and exact deployed commit in a real browser
        env:
          SITE_URL: https://vonza967-oss.github.io/Homeoffice-hu/
          QA_DIR: qa-live
        run: npm run qa
      - name: Save live website evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeoffice-live-qa
          path: qa-live
          if-no-files-found: ignore
          retention-days: 7
