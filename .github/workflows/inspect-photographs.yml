name: Inspect manufacturer photography
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-photographs.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read public manufacturer catalogs and export current source
        run: |
          node <<'NODE'
          const fs=require('node:fs/promises'),path=require('node:path');
          const brands={oakywood:'https://oakywood.shop',balolo:'https://www.balolo.de',orbitkey:'https://www.orbitkey.com',satechi:'https://satechi.com',twelvesouth:'https://twelvesouth.eu',ugmonk:'https://ugmonk.com',fluidstance:'https://fluidstance.com',ergonofis:'https://ergonofis.com'};
          (async()=>{await fs.mkdir('candidate-review/feeds',{recursive:true});await fs.mkdir('candidate-review/source/scripts',{recursive:true});await fs.mkdir('candidate-review/source/tests',{recursive:true});await fs.mkdir('candidate-review/source/.github/workflows',{recursive:true});
          for(const f of ['index.html','styles.css','refinements.css','app.js','catalog.json','image-sources.json','package.json','AGENTS.md','README.md','scripts/build.cjs','scripts/qa.cjs','scripts/serve.cjs','tests/catalog.test.cjs','.github/workflows/deploy-pages.yml']){try{await fs.copyFile(f,path.join('candidate-review/source',f));}catch(e){console.log(f,String(e));}}
          const results=await Promise.all(Object.entries(brands).map(async([key,base])=>{try{const r=await fetch(base+'/products.json?limit=250',{headers:{'User-Agent':'Mozilla/5.0','Accept':'application/json'},signal:AbortSignal.timeout(45000)});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();await fs.writeFile('candidate-review/feeds/'+key+'.json',JSON.stringify({base,products:data.products},null,2));return {key,ok:true,count:data.products?.length};}catch(e){return {key,ok:false,error:String(e)};}}));await fs.writeFile('candidate-review/results.json',JSON.stringify(results,null,2));console.log(results);})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: manufacturer-catalog-candidates
          path: candidate-review
          include-hidden-files: true
          retention-days: 3
