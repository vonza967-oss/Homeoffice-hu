name: Inspect catalog and photography
on:
  workflow_dispatch:
  push:
    branches: ['catalog-*']
    paths: ['.github/workflows/inspect-photographs.yml', 'catalog-expansion.json', 'image-sources.json', 'scripts/qa.cjs', 'refinements.css']
permissions:
  contents: read
concurrency:
  group: catalog-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .image-cache
          key: catalog-review-${{ hashFiles('catalog.json', 'catalog-expansion.json', 'image-sources.json', 'scripts/build.cjs') }}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Validate and optimize all source photographs
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Inspect every product, category and desktop/mobile flow
        run: npm run qa
      - name: Export built catalog and browser evidence for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-expansion-review
          path: |
            _site
            qa
          include-hidden-files: true
          retention-days: 3
