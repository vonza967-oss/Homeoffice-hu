name: Review product-led page design
on:
  push:
    branches: [product-led-homepage]
    paths: ['.github/workflows/design-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/campaign.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-photographs
          path: |
            _site/assets
            qa/campaign-assets.json
            scripts/campaign.cjs
          retention-days: 3
